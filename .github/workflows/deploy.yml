name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check site files
        run: |
          set -euo pipefail
          test -s index.html
          test -s CNAME
          grep -q '<html' index.html
          echo "Custom domain: $(tr -d '[:space:]' < CNAME)"

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/whatsapp-api
          cp index.html CNAME _site/
          # /whatsapp-api and /whatsapp-api/ both serve the funnel
          cp index.html _site/whatsapp-api.html
          cp index.html _site/whatsapp-api/index.html

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
